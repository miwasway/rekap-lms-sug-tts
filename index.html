:root{--bg:#14213D;--paper:#14213D;--ink:#F4EEE3;--ink2:#C6D0E0;--mute:#8E9CB8;--rule:rgba(255,255,255,.14);--lite:rgba(255,255,255,.09);--card:#1D2C50;--card2:#24365F;
 --acc:#FF5B4A;--accL:rgba(255,91,74,.28);--grey:#6F819C;--navy:#6E9BFF;--teal:#00A38C;--tealL:#37D3B9;--sun:#FFC53D;--coral:#FF5B4A;--sky:#3D7BFF;--skyL:#7EA6FF;--vio:#7B5CFF;--vioL:#A894FF;--tealD:#37D3B9;--skyD:#7EA6FF;--vioD:#A894FF;--coralD:#FF7A6B;--sunD:#FFC53D;--inkD:#F4EEE3}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#0B1222;overflow:hidden;font-family:'Inter',system-ui,sans-serif;color:var(--ink)}
#app{position:fixed;inset:0;display:grid;grid-template-columns:1fr 300px}
#app.nolist{grid-template-columns:1fr 0}
#main{display:flex;flex-direction:column;min-width:0}
#vp{flex:1;position:relative;overflow:hidden}
#stage{width:1600px;height:900px;position:absolute;left:50%;top:50%;overflow:hidden;background:var(--bg);transform-origin:center;border-radius:12px;box-shadow:0 30px 80px rgba(0,0,0,.5)}
#ctl{height:60px;flex:none;display:flex;align-items:center;gap:8px;padding:0 18px;background:#0F182D;border-top:1px solid rgba(255,255,255,.08)}
#ctl button{border:1px solid rgba(255,255,255,.16);background:#18233F;color:#F4EEE3;height:36px;min-width:38px;border-radius:18px;font:inherit;font-size:14px;font-weight:700;cursor:pointer;padding:0 12px}
#ctl button:hover{background:#22305A}
#ctl #bPl{background:var(--sun);color:#14213D;border-color:var(--sun)}
#now{font-size:14px;color:#C6D0E0;min-width:240px;max-width:340px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#now b{color:#fff}
#scrub{flex:1;accent-color:var(--sun);min-width:80px}
#pg{font-size:13px;color:#8E9CB8;font-variant-numeric:tabular-nums;min-width:66px;text-align:center}
#side{background:#0F182D;border-left:1px solid rgba(255,255,255,.08);overflow:auto;padding:14px 10px 30px}
#side h5{font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:#8E9CB8;padding:4px 10px 8px}
.it{width:100%;display:flex;gap:10px;align-items:center;text-align:left;padding:7px 10px;border-radius:12px;border:0;background:none;color:#E7ECF5;font:inherit;cursor:pointer}
.it:hover{background:#18233F}.it.on{background:#1F2E52;box-shadow:inset 3px 0 0 var(--sun)}
.it .av{flex:none;width:38px;height:38px;border-radius:50%;overflow:hidden;background:#2A3A62;display:grid;place-items:center;font-size:13px;font-weight:800;color:#14213D}
.it .av img{width:100%;height:100%;object-fit:cover}
.it .tx{min-width:0}.it .tx div{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.it small{display:block;font-size:11.5px;color:#8E9CB8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it .sc2{font-size:11px;font-weight:800;color:#14213D;background:var(--sun);border-radius:9px;padding:1px 7px;margin-left:auto;flex:none}
.subs{display:none;margin:2px 0 6px 58px;flex-direction:column;gap:1px}
.subs.on{display:flex}
.subs a{font-size:12.5px;color:#9FB0C8;text-decoration:none;padding:3px 8px;border-radius:8px;cursor:pointer}
.subs a:hover{background:#18233F}.subs a.on{color:#fff;font-weight:800;background:#1A2748}
/* adegan */
.sc{position:absolute;inset:0;background:var(--bg)}
.serif{font-family:'Inter',sans-serif;font-weight:700}
.kick{font-size:14px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--sun)}
.rv{opacity:0}.pp{opacity:0}.gx{transform:scaleX(0);transform-origin:left}.gy{transform:scaleY(0);transform-origin:bottom}.wipe{clip-path:inset(0 100% 0 0)}
.mark{color:var(--sun)}
.mqL,.mqR{display:flex;width:max-content}
.mqL{animation:mqL var(--t,50s) linear infinite}.mqR{animation:mqR var(--t,50s) linear infinite}
@keyframes mqL{to{transform:translateX(-50%)}}@keyframes mqR{from{transform:translateX(-50%)}to{transform:none}}
.flow{animation:flow 1.1s linear infinite}
@keyframes flow{from{stroke-dashoffset:0}to{stroke-dashoffset:-22.8}}
.blr{animation:blr 1.4s ease-in-out infinite}
@keyframes blr{0%,100%{filter:none;box-shadow:none}50%{filter:brightness(1.45);box-shadow:0 0 14px 2px rgba(255,91,74,.75)}}
.paused .mqL,.paused .mqR,.paused .blk,.paused .blr,.paused .flow{animation-play-state:paused}
.blk{animation:blk 6s steps(1,end) infinite;border-radius:5px;padding:0 3px;margin:0 -3px}
@keyframes blk{0%{color:#0F1A33;background:var(--tealL)}8%{color:inherit;background:transparent}100%{color:inherit;background:transparent}}
.tab{font-variant-numeric:tabular-nums}
.pgw{position:absolute;inset:0;padding:30px 64px 56px;display:flex;flex-direction:column}
.sec{display:flex;justify-content:space-between;align-items:center;padding-bottom:12px;border-bottom:1px solid var(--rule);flex:none}
.sec .r{font-size:13px;color:var(--mute);letter-spacing:.04em}
.sc>.sec{position:absolute;left:70px;right:70px;top:30px}
.hd{font-size:40px;line-height:1.14;font-weight:800;letter-spacing:-.015em;margin-top:20px;max-width:1420px;flex:none}
.dk{font-size:19px;line-height:1.5;color:var(--ink2);margin-top:10px;max-width:1400px;flex:none}
.bd{flex:1;min-height:0;margin-top:24px;position:relative}
.srcl,.src{position:absolute;left:64px;bottom:18px;right:64px;font-size:13px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lbl{font-size:16px;font-weight:800}
.sub{font-size:13px;color:var(--ink2);margin-top:4px}
.scr{overflow:hidden;height:100%;position:relative}
.scr.ovf{-webkit-mask-image:linear-gradient(#000 88%,transparent);mask-image:linear-gradient(#000 88%,transparent)}
.tr{display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--rule)}
.th{font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
.num{font-family:'Oswald',sans-serif;font-weight:600;line-height:1;letter-spacing:-.005em}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-weight:700;padding:2px 9px;border:1px solid var(--rule);border-radius:12px;background:var(--card);white-space:nowrap;color:var(--ink)}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cl2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ph{background:var(--card);overflow:hidden;border-radius:10px}.ph img{width:100%;height:100%;object-fit:cover;display:block}
.cap{font-size:12.5px;color:var(--ink2);margin-top:5px;line-height:1.3}
.rule2{border-top:2px solid var(--ink)}
/* infografis A */
.D{font-family:'Oswald',sans-serif;font-weight:700;letter-spacing:-.01em;line-height:.92;font-variant-numeric:tabular-nums}
.tile{display:grid;place-items:center}
.k{will-change:transform,opacity}
.t1{font-size:46px;font-weight:800;letter-spacing:-.02em;line-height:1.1}.t0{font-size:15px;font-weight:800;letter-spacing:.16em;text-transform:uppercase}.lab{font-size:18px;font-weight:700;color:var(--ink2);line-height:1.3}.sm{font-size:14px;color:var(--mute);line-height:1.4}

@media (max-width:899px){
 #app{grid-template-columns:1fr!important}
 #side{position:fixed;top:0;right:0;bottom:0;width:min(86vw,340px);z-index:50;box-shadow:-20px 0 60px rgba(0,0,0,.6);transform:translateX(0);transition:transform .25s}
 #app.nolist #side{transform:translateX(105%)}
 #ctl{height:auto;min-height:52px;gap:5px;padding:6px 8px calc(6px + env(safe-area-inset-bottom));flex-wrap:wrap}
 #ctl button{height:38px;min-width:38px;padding:0 9px;font-size:14px}
 #now{display:none}#pg{font-size:12px}
 #scrub{order:10;flex-basis:100%;margin:2px 4px 0}
}
@media (max-width:420px){#bSp{display:none}}
#rot{display:none}
@media (orientation:portrait) and (max-width:700px){
 #rot{display:flex;position:fixed;left:10px;right:10px;top:calc(10px + env(safe-area-inset-top));z-index:60;background:#FFC53D;color:#14213D;border-radius:12px;padding:10px 14px;font-size:14px;font-weight:700;align-items:center;gap:10px;box-shadow:0 10px 30px rgba(0,0,0,.4)}
 #rot.x{display:none}
 #rot b{margin-left:auto;font-size:20px;cursor:pointer;padding:0 4px}
}

  const RH=Math.min(28,440/R.length);

  const rows=R.map((g,i)=>{const p=g.M.p, mn=Math.min(...p.ins), mx=Math.max(...p.ins);
    return `<div style="position:absolute;left:0;top:${i*RH}px;height:${RH}px;width:100%;display:flex;align-items:center">
      <div class="rv" style="--d:${(1+i*.05).toFixed(2)}s;width:190px;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(first2(g.n))}</div>

        ${mx>hi?`<span class="rv" style="--d:${(1.6+i*.05).toFixed(2)}s;position:absolute;left:${W+2}px;top:calc(50% - 10px);font-size:13px;color:var(--mute)">›</span>`:""}<div class="pp" style="--d:${(1.5+i*.05).toFixed(2)}s;position:absolute;left:${sx(p.avgIn)-6}px;top:calc(50% - 6px);width:12px;height:12px;border-radius:50%;background:${p.avgIn<=P.avg?"var(--ink)":"#fff"};border:2px solid var(--ink)"></div>

  return `<div class="sc"><div class="sec"><span class="kick rv" style="--d:.2s">01 · Kehadiran guru</span><span class="r rv" style="--d:.3s">Senin 16 – Kamis 26 November</span></div>

  <div class="src rv" style="--d:2.8s">Sumber: presensi guru di LMS, 16–26 Nov. Jumat–Sabtu 13–14 November adalah sesi pelatihan dan tidak dihitung.</div></div>`;
}

// ---------- 3. Jurnal ----------
function s3(){
  const COL={tp:"var(--teal)",terisi:"var(--ink)",khusus:"var(--grey)",terlewat:"var(--acc)",belum:"transparent"}; const stt=s=>{let t=st(s); if(t==="khusus"&&s.sm!=="digantikan")t="terisi"; return (t==="terisi"||t==="khusus")&&s.doc&&s.doc.tp?"tp":t;};
  const days=RD.map(d=>{const L=[]; G.forEach(g=>g.jur.filter(s=>s.d===d).forEach(s=>L.push(stt(s)))); const o={tp:0,terisi:1,khusus:2,terlewat:3,belum:4}; L.sort((a,b)=>o[a]-o[b]); return {d,L};});
  const SQ=RD.length>8?20:RD.length>5?24:38,GP=RD.length>5?4:5, PER=3;

     <div style="margin-top:10px;font-size:14px;font-weight:700">${RD.length>5?HR3[x.d]+" "+(+x.d.slice(8)):HR[x.d]}</div><div class="tab" style="font-size:13px;color:var(--mute)">${x.L.length} sesi</div></div>`;}).join("");
  const grp=(t,c,list,d0)=>list.length?`<div class="rv" style="--d:${d0}s;display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--ink);padding:6px 0 3px;margin-top:2px"><span style="font-size:12.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:${c}">${t}</span><span style="font-size:13px;color:var(--ink2)">${list.length} guru</span></div>`+
    list.map((g,i)=>`<div style="display:flex;align-items:center;height:22px;gap:10px"><span class="rv" style="--d:${(d0+.1+i*.05).toFixed(2)}s;width:190px;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(first2(g.n))}</span>
      <span style="flex:1;height:12px;background:var(--lite);position:relative"><i class="gx" style="--d:${(d0+.2+i*.05).toFixed(2)}s;position:absolute;inset:0;width:${g.M.j.pct}%;background:${c}"></i></span>
      <span class="rv tab" style="--d:${(d0+.4+i*.05).toFixed(2)}s;width:46px;text-align:right;font-size:15px">${g.M.j.sudah}/${g.M.j.base}</span><span class="rv tab" style="--d:${(d0+.4+i*.05).toFixed(2)}s;width:46px;text-align:right;font-size:15px;font-weight:700;color:${c}">${g.M.j.pct}%</span></div>`).join(""):"";
  return `<div class="sc"><div class="sec"><span class="kick rv" style="--d:.2s">02 · Jurnal mengajar</span><span class="r rv" style="--d:.3s">Senin 16 – Kamis 26 November</span></div>
  <h2 class="serif rv" style="--d:.4s;position:absolute;left:70px;top:92px;width:1360px;font-size:44px;line-height:1.12;font-weight:600;letter-spacing:-.01em">${J.sudah} dari ${J.base} sesi berjurnal; <span class="mark" style="--d:1.4s">${TERT.length} guru mengisi semuanya</span></h2>
  <p class="serif rv" style="--d:.7s;position:absolute;left:70px;top:160px;width:1360px;font-size:21px;line-height:1.45;color:var(--ink2)"><span style="color:var(--tealL);font-weight:700">${J.tp} jurnal sudah mencantumkan TP</span> · ${J.lewat} sesi terlewat${J.belum?` · ${J.belum} sesi hari ini belum diisi`:""}</p>
  <div style="position:absolute;left:70px;top:226px;width:700px">
    <div class="rv" style="--d:.9s;font-size:16px;font-weight:700">Setiap kotak adalah satu sesi mengajar</div>

    ${G4.map((x,k)=>grp(x[0]+" · "+x[1],x[3],x[4],1.2+k*.55)).join("")}
    ${NOJ.length?`<div class="rv" style="--d:3s;font-size:13px;color:var(--mute);margin-top:8px">Tanpa sesi terjadwal selama 16–26 Nov: ${NOJ.map(g=>esc(first2(g.n))).join(", ")}</div>`:""}
  </div>
  <div class="src rv" style="--d:3s">Tertib 100% · cukup tertib 70–99% · sebagian terlewat 50–69% · banyak terlewat di bawah 50%. Sumber: jurnal mengajar di LMS, 16–26 Nov.</div></div>`;
}


// ---------- Pola kehadiran ----------
function sGrid(){
  const days=[...RD];
  const F=G.filter(g=>g.M.p.wd&&g.M.p.masuk>=g.M.p.wd);
  const tm=v=>{const t=String(v).split(":");return +t[0]*60+ +t[1];};
  const WARN=[]; G.forEach(g=>g.pres.filter(x=>!PEL(x.d)&&x.in&&(x.st==="hadir"||x.st==="terlambat")&&tm(x.in)>=LUPA).forEach(x=>WARN.push({g,x})));
  const cell=(g,d)=>{const x=g.pres.find(p=>p.d===d)||{st:"belum"}; const pel=PEL(d);
    if(x.st==="alpha") return `<span style="color:var(--acc);font-weight:700">alpha</span>`;
    if(x.st==="belum") return `<span style="color:${pel?"var(--lite)":"var(--grey)"}">${pel?"–":(days.length>5?"–":"tidak terjadwal")}</span>`;
    if(pel) return `<span style="color:var(--mute)">${x.in||"–"}</span>`;
    const late=x.st==="terlambat", far=x.in&&tm(x.in)>=LUPA;
    if(far) return `<span style="display:inline-flex;align-items:center;gap:5px;background:rgba(255,91,74,.18);border:1px solid var(--coral);border-radius:6px;padding:1px 7px;color:#FF8A7D;font-weight:800">⚠ ${x.in}</span>`;
    return `<span style="display:inline-flex;align-items:center;gap:6px;color:${late?"var(--sun)":"var(--tealL)"};font-weight:${late?800:600}"><i style="width:9px;height:9px;border-radius:2px;background:${late?"var(--sun)":"var(--teal)"}"></i>${x.in||"–"}</span>`;};
  const W=[186,...days.map(()=>Math.floor(770/days.length)),52,96];
  const row=(c,i,h)=>`<div class="tr ${h?"":"rv"}" style="${h?"":D(.9+i*.04)};height:${h?34:28.5}px;font-size:${h?12:15}px">${c.map((x,k)=>`<span class="${h?"th":"tab"} ell" style="width:${W[k]}px;${k>0&&k<=days.length?"text-align:left":""}${k>days.length?"text-align:right;":""}">${x}</span>`).join("")}</div>`;
  const head=row(["Guru",...days.map(d=>`${HR3[d]} ${+d.slice(8)}`),"Hadir","Jam tipikal"],0,1);
  const body=G.map((g,i)=>row([esc(first2(g.n)),...days.map(d=>cell(g,d)),`<b>${g.M.p.masuk}</b>/${g.M.p.wd}`,`<b>${hm(g.M.p.medIn)}</b>`],i)).join("");
  return page({k:"01 · Kehadiran guru",h:`${mk(F.length+" guru")} hadir di semua hari terjadwal`,
   dk:`<span style="display:flex;flex-wrap:wrap;gap:7px">${F.map((g,i)=>`<span class="k" data-a="zoom" data-t="${(1.2+i*.3).toFixed(2)}" data-c="teal" style="font-size:16px;font-weight:700;padding:4px 12px;border-radius:14px;white-space:nowrap">${esc(first2(g.n))}</span>`).join("")}</span><span style="display:block;margin-top:10px;font-size:17px">Separuh presensi tercatat sebelum pukul <b style="color:var(--sun)">${hm(P.med)}</b> · <b style="color:#FF8A7D">${WARN.length} presensi</b> pukul 10.00 atau lebih perlu diingatkan</span>`,
   b:`<div style="display:grid;grid-template-columns:1fr 270px;gap:30px;height:100%">
     <div>${head}${body}</div>
     <div class="rv" style="${D(1.4)};border-top:2px solid var(--ink);padding-top:12px">
       <div><div class="lbl" style="color:#FF8A7D">⚠ Perlu diingatkan</div><div class="sub">Presensi pukul 10.00 atau lebih, jauh melewati batas terlambat. Kemungkinan lupa presensi saat datang.</div>
        ${WARN.length?WARN.map(w=>`<div style="display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-bottom:1px solid var(--rule);font-size:14px"><span><b>${esc(first2(w.g.n))}</b><br><span style="color:var(--mute);font-size:12.5px">${HR[w.x.d]} ${TGL(w.x.d)}</span></span><b class="tab" style="color:#FF8A7D">${w.x.in}</b></div>`).join(""):`<div class="sub">Tidak ada.</div>`}</div>
       <div style="margin-top:14px;display:flex;gap:18px"><div><div class="num" style="font-size:40px">${P.perDay}<span style="font-size:20px;color:var(--mute)">/${G.length}</span></div><div class="sub">guru presensi per hari</div></div><div><div class="num" style="font-size:40px;color:var(--acc)">${P.alpha}</div><div class="sub">kali alpha</div></div></div>
     </div></div>`,
   s:`Sumber: presensi guru di LMS, 16–26 Nov · hijau = tepat waktu, kuning = terlambat · – = tidak terjadwal · jam tipikal = jam masuk tengah (median) tiap guru`});
}

// ---------- Dokumentasi kelas ----------

  const pick=["j14","j20","j30","j13","j40","j8","j26","j38","j16","j41","j23","j35","j22","j12","j29","j19","j11","j27","j43","j33","j9","j36","j34","j42"];
  meta.sort((a,b)=>(pick.indexOf(a.f)+1||99)-(pick.indexOf(b.f)+1||99));
  const rows=[0,1,2].map(r=>meta.filter((x,i)=>i%3===r));
  const card=x=>`<div style="flex:none;width:250px"><div class="ph" style="height:150px"><img src="${PH[x.f]}"></div><div class="cap ell"><b style="color:var(--ink)">${x.s.k} · ${esc(mS2(x.s.m))}</b> · ${esc(first2(x.g.n))}, ${HR[x.s.d]} ${TGL(x.s.d)}</div></div>`;
  const n=SUM(g=>g.M.foto);
  return page({k:"03 · Dokumentasi kelas",h:`${n} sesi mengajar dilengkapi foto kegiatan kelas`,

// ---------- Capaian TP ----------
function tpNote(g){const j=g.M.j; if(!j.sudah) return "belum ada jurnal terisi"; if(j.tp>=j.sudah) return `semua berisi TP · ${j.tpU} TP berbeda`; const noTP=j.sudah-j.tp; if(j.ganti&&j.ganti>=noTP) return `${noTP} diisi saat digantikan`; return `${noTP} jurnal terisi tanpa TP`;}
function sTP(){
  const L2=[...G].filter(g=>g.M.j.base).sort((a,b)=>b.M.j.tp-a.M.j.tp||b.M.j.tpU-a.M.j.tpU||b.M.j.pct-a.M.j.pct);
  const mx=Math.max(...L2.map(g=>g.M.j.tp),1); const top=L2.filter(g=>g.M.j.tp===L2[0].M.j.tp);
  const ex=[]; G.forEach(g=>g.jur.filter(s=>!PEL(s.d)&&s.doc&&s.doc.tp).forEach(s=>ex.push({g,s})));
  const exs=[]; ex.sort((a,b)=>b.s.d.localeCompare(a.s.d)).forEach(x=>{if(exs.length<5&&!exs.some(y=>y.g===x.g))exs.push(x);});
  return page({k:"03 · Capaian tujuan pembelajaran",h:`${J.tp} dari ${J.sudah} jurnal terisi sudah mencantumkan ${mk("tujuan pembelajaran (TP)")}`,
   dk:`${LJ(top.map(g=>first2(g.n)))} paling sering mencantumkan TP (${top[0].M.j.tp} jurnal). Jurnal yang diisi saat guru digantikan atau tanpa isian TP tidak dihitung ber-TP.`,
   b:`<div style="display:grid;grid-template-columns:1fr 400px;gap:40px;height:100%">
    <div><div class="tr" style="height:30px"><span class="th" style="width:26px">#</span><span class="th" style="width:190px">Guru</span><span class="th" style="flex:1">Jurnal ber-TP</span><span class="th" style="width:110px;text-align:right">Jurnal terisi</span><span class="th" style="width:90px;text-align:right">Ada TP</span><span class="th" style="width:200px;text-align:right">Keterangan</span></div>
     ${L2.map((g,i)=>`<div class="tr" style="height:29px"><span class="rv tab" style="${D(.9+i*.04)};width:26px;color:${i<3?"var(--acc)":"var(--mute)"};font-weight:700">${i+1}</span><span class="rv ell" style="${D(.9+i*.04)};width:190px;font-size:15px">${esc(first2(g.n))}</span><span style="flex:1">${bar(g.M.j.tp/mx*100,g.M.j.tp&&g.M.j.tp>=g.M.j.sudah?"var(--teal)":g.M.j.tp?"var(--sun)":"var(--grey)",1.1+i*.04,12)}</span><span class="rv tab" style="${D(1.3+i*.04)};width:110px;text-align:right;font-size:15px">${g.M.j.sudah} dari ${g.M.j.base}</span><span class="rv tab" style="${D(1.3+i*.04)};width:90px;text-align:right;font-size:15px;font-weight:800;color:${g.M.j.tp?"var(--tealL)":"#FF8A7D"}">${g.M.j.tp} jurnal</span><span class="rv" style="${D(1.3+i*.04)};width:200px;text-align:right;font-size:13px;color:var(--mute)">${tpNote(g)}</span></div>`).join("")}</div>
    <div class="rv" style="${D(1.6)};border-top:2px solid var(--ink);padding-top:12px"><div class="lbl">Contoh TP yang dicatat guru</div>
     ${exs.map((x,k)=>`<div style="padding:11px 0;border-bottom:1px solid var(--rule)"><div class="serif cl2" style="font-size:17px;line-height:1.35">“${esc(x.s.doc.tp)}”</div><div class="sub">${esc(first2(x.g.n))} · ${esc(mS2(x.s.m))} · ${x.s.k}, ${HR[x.s.d]} ${TGL(x.s.d)}</div></div>`).join("")}</div></div>`,
   s:`Sumber: jurnal mengajar di LMS (isian TP dari ATP). ${PELNOTE}`});
}

// ---------- Keterhubungan ----------

    ${list.map((g,i)=>`<div class="tr" style="height:52px"><span class="rv ell" style="${D(.9+(i+o)*.04)};width:200px;font-size:17px;${g.M.con?"":"color:var(--mute)"}">${esc(first2(g.n))}</span>${KELAS.map((k,z)=>`<span style="width:40px;display:grid;place-items:center"><i class="pp" style="${D(1.1+(i+o)*.04+z*.05)};width:26px;height:26px;${g.M.k[k]?"background:var(--ink)":"border:1.5px solid var(--rule)"}"></i></span>`).join("")}<span class="rv tab" style="${D(1.4+(i+o)*.04)};flex:1;text-align:right;font-size:15px">${g.M.act?`<b>${g.M.act}</b>`:`<span style="color:var(--mute)">belum ada</span>`}</span></div>`).join("")}</div>`;

   s:`Respons = materi dibaca, latihan atau sumatif diikuti, dan tugas dikumpulkan (akumulasi semester).`});

  const big=(p,t,s,d)=>`<div class="rv" style="${D(d)};border-top:2px solid var(--ink);padding-top:10px"><div class="num" style="font-size:72px;color:${PC(p)}">${cnt(p,d+.2,"%")}</div><div style="font-size:17px;font-weight:700;margin-top:4px">${t}</div><div class="sub">${s}</div><div style="margin-top:10px">${bar(p,PC(p),d+.3,8)}</div></div>`;
  return page({k:gk(g,i,"Skor ketercapaian LMS"),r:gr(g),h:`Skor ketercapaian LMS ${mk(score+"%")}: ${lab}`,
   dk:`Menggunakan ${nf} dari 5 fitur LMS dan terhubung dengan ${cn.n} dari ${cn.of} siswa di kelas yang diampu.`,
   b:`<div style="display:grid;grid-template-columns:1fr 1fr;gap:60px;height:100%">
    <div><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:26px">${big(pF,"Penggunaan fitur",`${nf} dari 5 fitur digunakan`,.8)}${big(cn.p,"Terhubung dengan siswa",`${cn.n} dari ${cn.of} siswa`,1)}${big(score,"Ketercapaian fitur","rata-rata lima fitur",1.2)}</div>
     <div class="rv" style="${D(1.6)};display:flex;gap:8px;flex-wrap:wrap;margin-top:22px">${cn.rows.map(r=>`<span class="chip" style="font-size:14px;${r[1]?"":"color:var(--acc);border-color:var(--acc)"}">${r[0]} · ${r[1]}/${r[2]} siswa</span>`).join("")}</div>
     <div class="rv" style="${D(2)};font-size:13px;color:var(--mute);line-height:1.5;margin-top:22px">Penggunaan fitur = jumlah fitur yang digunakan dari lima fitur; hanya konten yang sudah terbit dan berisi yang dihitung. Terhubung = siswa di kelas yang diampu yang sudah membaca, mengumpulkan, mengerjakan, atau mengomentari konten guru ini. Ketercapaian fitur = rata-rata persentase kelima fitur (fitur yang belum digunakan dihitung 0%).</div></div>
    <div class="rv" style="${D(1)};border-top:2px solid var(--ink)"><div class="lbl" style="margin-top:10px">Rincian per fitur</div><div class="sub">Siswa yang merespons dari siswa sasaran</div>
     ${all.map((n,k)=>{const f=F.find(x=>x[0]===n); if(!f) return `<div class="tr" style="padding:14px 0;justify-content:space-between;color:var(--mute)"><span style="font-size:18px;font-weight:700">${n}</span><span>belum digunakan</span></div>`;
      const p=Math.min(100,pctS(f[1],f[2])); return `<div style="padding:12px 0;border-bottom:1px solid var(--rule)"><div style="display:flex;justify-content:space-between;align-items:baseline"><span style="font-size:18px;font-weight:700">${f[0]}</span><span class="num tab" style="font-size:34px;color:${PC(p)}">${cnt(p,1.2+k*.15,"%")}</span></div><div style="margin-top:4px">${bar(p,PC(p),1.3+k*.15,9)}</div><div class="sub">${f[1]} dari ${f[2]} ${f[3]}</div></div>`}).join("")}</div></div>`,
   s:`Warna: hijau ≥ 80% · kuning 50–79% · merah di bawah 50%. Sumber: jurnal dan pemantauan konten di LMS.`});
}

const FC={mat:"#5B9BFF",lat:"#A894FF",sum:"#37D3B9",tug:"#FFB347"};
const GOLD="#FFC53D";

function sKon(){
  const con=G.filter(g=>g.M.con).length;
  const L=[...G].sort((a,b)=>(b.M.act?1:0)-(a.M.act?1:0)||connOf(b).p-connOf(a).p||b.M.con-a.M.con);
  const half=Math.ceil(L.length/2);
  const box=(g,k,d)=>{const on=g.M.k[k], taught=g.kl.includes(k);
    const st=on?`background:#00A38C;border:2px solid #37D3B9`:taught?`background:rgba(255,91,74,.22);border:2px solid #FF5B4A`:`border:1.5px dashed #3A4766`;
    return `<span style="width:44px;display:grid;place-items:center"><i class="pp" style="${D(d)};width:24px;height:24px;border-radius:6px;${st};display:grid;place-items:center;font-style:normal;font-size:13px;font-weight:900;color:${on?"#0F1A33":"#FF8A7D"}">${on?"✓":taught?"✕":""}</i></span>`;};
  const brk=g=>{const c=connOf(g); if(!g.M.act) return `<span style="color:var(--mute);font-size:14px">belum ada respons</span>`;
    const col=c.p>=60?"#37D3B9":c.p>=30?"#FFC53D":"#FF8A7D";
    const parts=[[g.M.baca,"bacaan materi",FC.mat],[g.M.ikut,"ikut latihan/sumatif",FC.lat],[g.M.kumpul,"tugas masuk",FC.tug]].filter(p=>p[0]);
    return `<span style="display:block;text-align:right"><span style="font-size:15px;color:var(--ink2)"><b class="num" style="font-size:26px;color:${col}">${c.n}</b> dari ${c.of} siswa · <b style="color:${col}">${c.p}%</b></span><span style="display:block;height:6px;border-radius:3px;background:var(--lite);margin:4px 0 3px;overflow:hidden"><i style="display:block;height:100%;width:${c.p}%;background:${col}"></i></span><span style="font-size:12px;white-space:nowrap">${parts.map(p=>`<b style="color:${p[2]}">${p[0]}</b> <span style="color:var(--mute)">${p[1]}</span>`).join(" · ")}</span></span>`;};
  const tb=(list,o)=>`<div><div class="tr" style="height:30px"><span class="th" style="width:190px">Guru</span>${KELAS.map(k=>`<span class="th" style="width:44px;text-align:center">${k}</span>`).join("")}<span class="th" style="flex:1;text-align:right">Siswa yang merespons</span></div>
    ${list.map((g,i)=>`<div class="tr" style="height:62px"><span class="rv ell" style="${D(.9+(i+o)*.04)};width:190px;font-size:16.5px;font-weight:600;${g.M.con?"":"color:var(--mute)"}">${esc(first2(g.n))}</span>${KELAS.map((k,z)=>box(g,k,1.1+(i+o)*.04+z*.05)).join("")}<span class="rv" style="${D(1.4+(i+o)*.04)};flex:1;padding-left:16px">${brk(g)}</span></div>`).join("")}</div>`;
  const lg=[["background:#00A38C;border:2px solid #37D3B9","Kelas sudah merespons"],["background:rgba(255,91,74,.22);border:2px solid #FF5B4A","Diampu, belum ada respons"],["border:1.5px dashed #3A4766","Tidak diampu"]];
  return page({k:"03 · Keterhubungan guru dan siswa",h:`${con} dari ${G.length} guru sudah mendapatkan ${mk("respons siswa")} melalui LMS`,
   dk:`Angka utama = siswa di kelas yang diampu yang sudah membaca, mengerjakan, atau mengumpulkan konten guru. Rincian di bawahnya: <b style="color:${FC.mat}">materi dibaca</b>, <b style="color:${FC.lat}">ikut latihan/sumatif</b>, <b style="color:${FC.tug}">tugas masuk</b> (akumulasi sejak 13 Nov, data per 26 Nov pukul 15.45).`,
   b:`<div class="rv" style="${D(.8)};display:flex;gap:22px;font-size:13.5px;color:var(--ink2);margin-bottom:8px">${lg.map(l=>`<span style="display:flex;gap:8px;align-items:center"><i style="width:16px;height:16px;border-radius:4px;${l[0]}"></i>${l[1]}</span>`).join("")}</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:56px">${tb(L.slice(0,half),0)}${tb(L.slice(half),half)}</div>`,
   s:`Sumber: pemantauan materi, latihan, sumatif, dan tugas di LMS (akumulasi sejak 13 Nov, data per 26 Nov pukul 15.45) · bacaan materi = jumlah siswa × materi yang sudah dibaca.`});
}

  const R=[...L].sort((a,b)=>b.pct-a.pct||b.got-a.got);
  return page({k:"03 · Dampak ke kelas",h:`Kelas ${R[0].k} paling interaktif: ${mk(R[0].pct+"% konten guru sudah direspons")}`,
   dk:`Persentase konten yang sudah dibaca atau dikerjakan siswa dari seluruh konten yang dibagikan guru semester ini. Disusul ${LJ(R.slice(1).map(c=>`${c.k} (${c.pct}%)`))}.`,
   b:`<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:18px;height:100%">${R.map((c,r)=>{const top=!r, col=top?GOLD:"var(--ink)";
     return `<div class="rv" style="${D(.9+r*.2)};padding:16px 22px;border-radius:16px;${top?`background:rgba(255,197,61,.1);border:2px solid ${GOLD};box-shadow:0 0 40px rgba(255,197,61,.15)`:"background:var(--card);border:1px solid var(--rule)"};position:relative">
      ${top?`<div class="k" data-a="pop" data-t="2.2" style="position:absolute;top:-16px;left:18px;background:${GOLD};color:#14213D;font-size:13px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;padding:5px 12px;border-radius:8px;box-shadow:0 4px 14px rgba(0,0,0,.3)">★ Paling interaktif di LMS</div>`:""}
      <div style="display:flex;justify-content:space-between;align-items:baseline;margin-top:${top?8:0}px"><span class="num" style="font-size:48px;color:${col}">${c.k}</span><span class="th" style="color:${top?GOLD:"var(--mute)"}">Peringkat ${r+1}</span></div>
      <div class="num" style="font-size:84px;margin-top:8px;color:${col}">${cnt(c.pct,1.2+r*.2,"%")}</div>

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:22px;padding-top:14px;border-top:1px solid ${top?"rgba(255,197,61,.4)":"var(--rule)"}">
       <div><div class="num" style="font-size:36px;color:${col}">${c.hp}%</div><div class="sub" style="margin:0">kehadiran siswa</div></div>
       <div><div class="num" style="font-size:36px;color:${col}">${c.ses}</div><div class="sub" style="margin:0">sesi diabsen</div></div>
       <div><div class="num" style="font-size:36px;color:${col}">${(EX.kelas[c.k]||{}).kom||0}</div><div class="sub" style="margin:0">siswa berkomentar</div></div>
       <div><div class="num" style="font-size:36px;color:${col}">${(EX.kelas[c.k]||{}).ai||0}</div><div class="sub" style="margin:0">siswa tanya AI</div></div></div>
    </div>`;}).join("")}</div>`,
   s:`Sumber: pemantauan materi, tugas, latihan, dan sumatif di LMS (semester ini) · warna: biru materi, oranye tugas, ungu latihan, hijau sumatif.`});
}

const dOf=e=>{const v=parseFloat(e.style.getPropertyValue("--d")); return isNaN(v)?0:v;};
function buildTL(sc){
  const tl=gsap.timeline({paused:true});
  sc.querySelectorAll(".rv").forEach(e=>tl.fromTo(e,{opacity:0,y:16,filter:"blur(5px)"},{opacity:1,y:0,filter:"blur(0px)",duration:.75,ease:"expo.out"},dOf(e)));
  sc.querySelectorAll(".gx").forEach(e=>tl.fromTo(e,{scaleX:0},{scaleX:1,duration:.9,ease:"power3.out",transformOrigin:"left center"},dOf(e)));
  sc.querySelectorAll(".gy").forEach(e=>tl.fromTo(e,{scaleY:0},{scaleY:1,duration:.9,ease:"expo.out",transformOrigin:"center bottom"},dOf(e)));
  sc.querySelectorAll(".pp").forEach(e=>tl.fromTo(e,{opacity:0,scale:.4},{opacity:1,scale:1,duration:.5,ease:"back.out(1.8)"},dOf(e)));
  sc.querySelectorAll(".wipe").forEach(e=>tl.fromTo(e,{clipPath:"inset(0 100% 0 0)"},{clipPath:"inset(0 0% 0 0)",duration:1,ease:"power3.inOut"},dOf(e)));
  sc.querySelectorAll(".mark").forEach(e=>tl.fromTo(e,{color:"#F4EEE3"},{color:"#FFC53D",duration:.6},dOf(e)||1.4));
  sc.querySelectorAll(".cnt").forEach(e=>{const o={v:0},v=+e.dataset.v,s=e.dataset.s||""; tl.fromTo(o,{v:0},{v,duration:1.2,ease:"power3.out",onUpdate:()=>{e.textContent=Math.round(o.v)+s;}},+e.dataset.d||0);});
  sc.querySelectorAll(".k[data-a]").forEach(e=>{const a=e.dataset.a, t=+e.dataset.t||0;
    if(a==="pop") tl.fromTo(e,{opacity:0,scale:0},{opacity:1,scale:1,duration:.6,ease:"back.out(2)"},t);
    else if(a==="rise") tl.fromTo(e,{opacity:0,y:26},{opacity:1,y:0,duration:.7,ease:"expo.out"},t);
    else if(a==="fade") tl.fromTo(e,{opacity:0},{opacity:1,duration:.5,ease:"power2.out"},t);
    else if(a==="blur") tl.fromTo(e,{opacity:0,filter:"blur(10px)"},{opacity:1,filter:"blur(0px)",duration:.28,ease:"power2.out"},t);
    else if(a==="zoom"){const c=e.dataset.c||"teal", bg={teal:"#00A38C",sky:"#5B9BFF",sun:"#FFC53D",coral:"#FF5B4A"}[c]||"#00A38C"; tl.set(e,{backgroundColor:bg,color:"#0F1A33"},0); tl.fromTo(e,{opacity:0,scale:.3},{opacity:1,scale:1.22,duration:.32,ease:"back.out(2)"},t); tl.to(e,{scale:1,backgroundColor:"rgba(255,255,255,.08)",color:"#F4EEE3",duration:.45,ease:"power2.out"},t+.4);}
    else if(a==="growx") tl.fromTo(e,{scaleX:0},{scaleX:1,duration:.6,ease:"power2.inOut",transformOrigin:"left center"},t);
    else if(a==="growy") tl.fromTo(e,{scaleY:0},{scaleY:1,duration:.75,ease:"expo.out",transformOrigin:"center bottom"},t);
    else if(a==="draw"){e.style.strokeDasharray="1"; const dd=+e.dataset.dur||.5; let hd=null, L=0;
      if(e.dataset.head){const ns="http://www.w3.org/2000/svg"; hd=document.createElementNS(ns,"circle"); hd.setAttribute("r",Math.max(7,(+e.getAttribute("stroke-width"))*.55)); hd.setAttribute("fill",e.dataset.head); hd.style.filter="drop-shadow(0 0 8px "+e.dataset.head+")"; hd.style.opacity=0; e.parentNode.appendChild(hd); L=e.getTotalLength();}
      const o={p:0}; tl.fromTo(o,{p:0},{p:1,duration:dd,ease:"power1.inOut",onUpdate:()=>{e.style.strokeDashoffset=1-o.p; if(hd){const pt=e.getPointAtLength(o.p*L); hd.setAttribute("cx",pt.x); hd.setAttribute("cy",pt.y); hd.style.opacity=(o.p>0&&o.p<1)?1:0;}}},t);
      tl.set(e,{opacity:0},0); tl.set(e,{opacity:1},t);}
    else if(a==="cnt"){const o={v:+e.dataset.from||0}, v=+e.dataset.v, f=e.dataset.fmt, suf=e.dataset.suf||""; tl.set(e,{opacity:0},0); tl.set(e,{opacity:1},t); tl.fromTo(o,{v:+e.dataset.from||0},{v,duration:1.3,ease:"power3.out",onUpdate:()=>{const n=Math.round(o.v); e.textContent=(f==="time"?hm(n):n)+suf;}},t);}
    if(e.dataset.out) tl.to(e,{opacity:0,y:-36,filter:"blur(8px)",duration:.22,ease:"power3.in"},+e.dataset.out);
    if(e.dataset.dim){const [a1,a2]=e.dataset.dim.split(",").map(Number); tl.to(e,{opacity:.28,duration:.35},a1); tl.to(e,{opacity:1,duration:.35},a2);}
  });
  let extra=0;
  sc.querySelectorAll(".scr").forEach(s=>{const inr=s.querySelector(".scri"); if(!inr)return; const ov=inr.scrollHeight-s.clientHeight; if(ov>6){s.classList.add("ovf"); const d=Math.max(5,ov/28); tl.fromTo(inr,{y:0},{y:-ov-20,duration:d,ease:"sine.inOut"},4); extra=Math.max(extra,4+d);}});
  return {tl,extra};
}

// ---------- daftar guru (samping) ----------
const side=document.getElementById("side");
side.innerHTML=`<h5>Daftar isi · pilih guru</h5>`+CH.map((c,k)=>`<button class="it" data-c="${k}">${c.g?`<span class="av">${c.g.best!=null&&PH[c.g.best]?`<img src="${PH[c.g.best]}" style="object-position:${fp(c.g,38,38)}">`:`<span style="color:#fff">${ini(c.g.n)}</span>`}</span>`:`<span class="av" style="background:var(--sun)">${k?"✓":"★"}</span>`}<span class="tx"><div>${esc(c.title)}</div><small>${esc(c.sub)}</small></span>${c.g?`<span class="sc2">${skor(c.g).score}%</span>`:""}</button><div class="subs" data-c="${k}">${S.slice(c.start,c.start+c.len).map((s,j)=>`<a data-i="${c.start+j}">${esc(s.n)}</a>`).join("")}</div>`).join("")+`<div style="font-size:11.5px;color:#6F819C;padding:14px 10px;line-height:1.6">Spasi putar/jeda · ←/→ halaman · ↑/↓ bab · F layar penuh</div>`;
side.addEventListener("click",e=>{const a=e.target.closest("a[data-i]"); if(a){go(+a.dataset.i); return;} const b=e.target.closest(".it"); if(b) go(CH[+b.dataset.c].start);});

// ---------- perbesar konten yang menyisakan ruang kosong ----------
function fitUp(sc){
  const bd=sc.querySelector(".pgw>.bd"); if(!bd) return;
  const H=bd.getBoundingClientRect().height; if(H<120) return;
  const meas=()=>{const R=bd.getBoundingClientRect(); let mb=R.top; bd.querySelectorAll("*").forEach(e=>{if(e.closest(".scri,.mqL,.mqR"))return; const b=e.getBoundingClientRect(); if(!(b.height>0&&b.width>0))return; if(Math.abs(b.bottom-R.bottom)<2&&b.height>R.height*.45)return; mb=Math.max(mb,b.bottom);}); return mb-R.top;};
  const over=()=>{const R=bd.getBoundingClientRect(), Q=sc.getBoundingClientRect(); let o=0; bd.querySelectorAll("*").forEach(e=>{if(e.closest(".scri,.mqL,.mqR"))return; const b=e.getBoundingClientRect(); if(b.height&&(b.bottom>R.bottom+1||b.right>Q.right-20))o=1;}); return o;};
  const used=meas(); let z=Math.min(1.32,(H*.95)/used); if(!(z>=1.07)) return;
  for(let k=0;k<5;k++){ bd.style.zoom=z; bd.style.width=(100/z)+"%"; bd.style.height=(H/z)+"px";
    if(!over()&&meas()<=H/1-4) return; z=1+(z-1)*.7; if(z<1.05){bd.style.zoom="";bd.style.width="";bd.style.height="";return;} }
  bd.style.zoom="";bd.style.width="";bd.style.height="";
}
// ---------- pemutar ----------
const stage=document.getElementById("stage"), scrub=document.getElementById("scrub");
let cur=-1, el=null, T=null, dur=10, t=0, play=true, speed=1, last=0;
function go(i){ i=Math.max(0,Math.min(S.length-1,i)); if(i===cur)return; const dir=i>cur?1:-1, old=el;
  const w=document.createElement("div"); let html; try{html=S[i].f();}catch(e){console.error(e); html=`<div class="sc"><div style="padding:80px;font-size:22px">Halaman ini gagal dimuat.</div></div>`;}
  w.innerHTML=html; el=w.firstElementChild; stage.appendChild(el);
  if(T) T.tl.kill(); T=buildTL(el); dur=Math.max(S[i].t,T.extra+3); t=0; T.tl.time(0);
  if(old){gsap.killTweensOf(old); gsap.to(old,{x:-260*dir,opacity:0,filter:"blur(14px)",duration:.45,ease:"power3.in",onComplete:()=>old.remove()});}
  gsap.fromTo(el,{x:260*dir,filter:"blur(14px)",opacity:cur<0?1:0},{x:0,filter:"blur(0px)",opacity:1,duration:.55,ease:"power3.out",delay:old?.12:0});
  cur=i; ui();}
function ui(){const c=CH[S[cur].ch]; document.getElementById("now").innerHTML=`<b>${esc(c.title)}</b> · ${esc(S[cur].n)}`; document.getElementById("pg").textContent=`${cur+1} / ${S.length}`;
  side.querySelectorAll(".it").forEach(x=>x.classList.toggle("on",+x.dataset.c===S[cur].ch)); side.querySelectorAll(".subs").forEach(x=>x.classList.toggle("on",+x.dataset.c===S[cur].ch)); side.querySelectorAll(".subs a").forEach(a=>a.classList.toggle("on",+a.dataset.i===cur));
  const on=side.querySelector(".it.on"); if(on) on.scrollIntoView({block:"nearest"});}
function tick(now){const dt=last?Math.min(.1,(now-last)/1000):0; last=now;
  if(play&&T){t+=dt*speed; if(t>=dur+.6){ if(cur<S.length-1) go(cur+1); else setPlay(false);} }
  if(T){T.tl.time(Math.min(t,T.tl.duration())); scrub.value=Math.round(Math.min(1,t/dur)*1000);} requestAnimationFrame(tick);}
scrub.oninput=()=>{t=scrub.value/1000*dur; setPlay(false);};
const bPl=document.getElementById("bPl"); function setPlay(p){play=p; bPl.textContent=p?"❚❚":"▶"; stage.classList.toggle("paused",!p);}
bPl.onclick=()=>{if(!play&&cur===S.length-1&&t>=dur){go(0);} setPlay(!play);};
const chOf=()=>S[cur].ch;
document.getElementById("bN").onclick=()=>go(cur+1); document.getElementById("bP").onclick=()=>go(cur-1);
document.getElementById("bNC").onclick=()=>{const c=chOf(); if(c<CH.length-1)go(CH[c+1].start);};
document.getElementById("bPC").onclick=()=>{const c=chOf(); go(cur>CH[c].start?CH[c].start:CH[Math.max(0,c-1)].start);};
document.getElementById("bSp").onclick=e=>{speed=speed===1?1.5:speed===1.5?2:speed===2?.75:1; e.currentTarget.textContent=speed+"×";};
document.getElementById("bL").onclick=()=>{document.getElementById("app").classList.toggle("nolist"); setTimeout(fit,60);};
stage.addEventListener("click",e=>{if(e.target.closest("button,a"))return; bPl.click();});
addEventListener("keydown",e=>{if(e.key==="ArrowRight")go(cur+1); else if(e.key==="ArrowLeft")go(cur-1); else if(e.key==="ArrowDown"){e.preventDefault();document.getElementById("bNC").click();} else if(e.key==="ArrowUp"){e.preventDefault();document.getElementById("bPC").click();} else if(e.key===" "){e.preventDefault();bPl.click();} else if(e.key==="f"||e.key==="F")document.getElementById("bFs").click();});
const vp=document.getElementById("vp");
function fit(){const s=Math.min(vp.clientWidth/1600,vp.clientHeight/900)*.97; stage.style.transform=`translate(-50%,-50%) scale(${s})`;}
if(innerWidth<900) document.getElementById("app").classList.add("nolist");
addEventListener("resize",fit); try{new ResizeObserver(fit).observe(vp);}catch(e){} fit();
document.getElementById("bFs").onclick=()=>{const d=document; try{if(d.fullscreenElement||d.webkitFullscreenElement){(d.exitFullscreen||d.webkitExitFullscreen).call(d);} else {const e=d.documentElement; (e.requestFullscreen||e.webkitRequestFullscreen).call(e);}}catch(e){}};
document.addEventListener("fullscreenchange",()=>setTimeout(fit,60));
window.go=go; window.setPlay=setPlay; window.setT=x=>{t=x;};
// geser (swipe) untuk pindah halaman di layar sentuh
(()=>{let x0=null,y0=0; vp.addEventListener("touchstart",e=>{const t=e.touches[0]; x0=t.clientX; y0=t.clientY;},{passive:true});
 vp.addEventListener("touchend",e=>{if(x0==null)return; const t=e.changedTouches[0], dx=t.clientX-x0, dy=t.clientY-y0; x0=null; if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)*1.5) go(cur+(dx<0?1:-1));},{passive:true});})();
// tutup daftar di HP setelah memilih
document.getElementById("side").addEventListener("click",e=>{if(innerWidth<900&&e.target.closest("a,button,[data-i],li,.it")) setTimeout(()=>document.getElementById("app").classList.add("nolist"),150);});
(document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(()=>{go(0); requestAnimationFrame(tick);});

</script></body></html>
